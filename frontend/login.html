<!DOCTYPE html>
<html lang="he" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionDine AI • כניסה מאובטחת</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 800: '#1e293b', 850: '#172033', 900: '#0f172a', 950: '#080d1a' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

  <div class="w-full max-w-md bg-surface-900 border border-slate-800 rounded-2xl shadow-2xl p-7 space-y-6">
    <!-- Brand -->
    <div class="text-center space-y-2">
      <div class="mx-auto w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/25">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-white">VisionDine <span class="text-blue-400">AI</span></h1>
      <p id="auth-subtitle" class="text-xs text-slate-400">גישה מאובטחת לניהול המסעדה והמצלמות</p>
    </div>

    <!-- Error / Status Message -->
    <div id="auth-alert" class="hidden text-xs rounded-xl px-4 py-3 border"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="space-y-4 hidden" onsubmit="submitLogin(event)">
      <div>
        <label class="block text-xs text-slate-300 mb-1.5">שם משתמש</label>
        <input id="login-username" type="text" value="admin" autocomplete="username" required
               class="w-full bg-surface-950 border border-slate-700 focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none font-mono" dir="ltr">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1.5">סיסמה</label>
        <input id="login-password" type="password" autocomplete="current-password" required placeholder="הזן סיסמת מנהל"
               class="w-full bg-surface-950 border border-slate-700 focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none">
      </div>
      <button id="btn-login" type="submit"
              class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm transition shadow-lg shadow-blue-500/20">
        כניסה למערכת
      </button>
    </form>

    <!-- FIRST-TIME SETUP FORM -->
    <form id="setup-form" class="space-y-4 hidden" onsubmit="submitSetup(event)">
      <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-xs leading-relaxed">
        <strong>הגדרה ראשונית מאובטחת:</strong> קבע סיסמת מנהל חזקה (לפחות 8 תווים) שתגן על המצלמות וההגדרות מהרשת.
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1.5">שם משתמש</label>
        <input id="setup-username" type="text" value="admin" required
               class="w-full bg-surface-950 border border-slate-700 focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none font-mono" dir="ltr">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1.5">סיסמה חדשה (לפחות 8 תווים)</label>
        <input id="setup-password" type="password" minlength="8" required placeholder="בחר סיסמה חזקה"
               class="w-full bg-surface-950 border border-slate-700 focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1.5">אימות סיסמה</label>
        <input id="setup-password-confirm" type="password" minlength="8" required placeholder="הקלד שוב את הסיסמה"
               class="w-full bg-surface-950 border border-slate-700 focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none">
      </div>
      <div id="setup-code-box" class="hidden">
        <label class="block text-xs text-slate-300 mb-1.5">קוד הגדרה חד-פעמי (מתוך <code class="text-amber-300">logs/server.log</code> במחשב המסעדה)</label>
        <input id="setup-code" type="text" placeholder="הדבק קוד הגדרה (נדרש רק מרחוק)"
               class="w-full bg-surface-950 border border-slate-700 focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none font-mono" dir="ltr">
      </div>
      <button id="btn-setup" type="submit"
              class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition shadow-lg shadow-emerald-500/20">
        שמור סיסמה והיכנס למערכת
      </button>
    </form>

    <div class="text-center text-[11px] text-slate-500 pt-2 border-t border-slate-800/80">
      מוגן בהצפנת PBKDF2-SHA256 • חסימת ניסיונות פריצה אוטומטית
    </div>
  </div>

  <script>
    function showAlert(msg, isError = true) {
      const box = document.getElementById('auth-alert');
      box.className = isError
        ? 'text-xs rounded-xl px-4 py-3 border bg-rose-500/10 border-rose-500/30 text-rose-300'
        : 'text-xs rounded-xl px-4 py-3 border bg-emerald-500/10 border-emerald-500/30 text-emerald-300';
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    async function initAuthView() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/';
          return;
        }
        if (!data.setup_complete) {
          document.getElementById('setup-form').classList.remove('hidden');
          document.getElementById('auth-subtitle').innerText = 'הגדרת סיסמת מנהל ראשונית';
          if (!data.is_local) {
            document.getElementById('setup-code-box').classList.remove('hidden');
          }
        } else {
          document.getElementById('login-form').classList.remove('hidden');
        }
      } catch (err) {
        showAlert('שגיאה בחיבור לשרת. ודא שהשרת פעיל.');
      }
    }

    async function submitLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-username').value.trim(),
            password: document.getElementById('login-password').value
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          showAlert(data.detail || 'שם משתמש או סיסמה שגויים');
        }
      } catch (err) {
        showAlert('שגיאת תקשורת עם השרת');
      } finally {
        btn.disabled = false;
      }
    }

    async function submitSetup(e) {
      e.preventDefault();
      const pw = document.getElementById('setup-password').value;
      const pw2 = document.getElementById('setup-password-confirm').value;
      if (pw !== pw2) {
        showAlert('הסיסמאות אינן תואמות');
        return;
      }
      const btn = document.getElementById('btn-setup');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('setup-username').value.trim(),
            password: pw,
            setup_code: document.getElementById('setup-code')?.value.trim() || ''
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showAlert('הסיסמה הוגדרה בהצלחה! מעביר למערכת...', false);
          setTimeout(() => { window.location.href = '/'; }, 600);
        } else {
          showAlert(data.detail || 'לא ניתן להשלים הגדרה');
        }
      } catch (err) {
        showAlert('שגיאת תקשורת עם השרת');
      } finally {
        btn.disabled = false;
      }
    }

    initAuthView();
  </script>
</body>
</html>
